version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - unparam
    - gocritic
  settings:
    revive:
      rules:
        - name: exported
    gosec:
      excludes:
        - G304
        - G204
        - G306
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

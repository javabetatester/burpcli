version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - unparam
    - gocritic
  settings:
    revive:
      rules:
        - name: exported
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (net.Conn).Close
        - (io.ReadCloser).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - fmt.Fprint
    gosec:
      excludes:
        - G304
        - G204
        - G306
  exclusions:
    rules:
      - path: internal/app/
        text: G402
      - path: internal/proxy/proxy.go
        text: G118
      - path: _test\.go
        linters:
          - gosec
          - errcheck
